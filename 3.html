<!DOCTYPE html>

<html lang="ja">

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap" rel="stylesheet">

<meta charset="UTF-8">
<title>既存/シリモニ</title>

<style>

body {
  background-color: #f5f5f5;
  font-family: "Hina Mincho", serif;
  margin: 40px;
}

.container {
  width: 80%;
  margin: 0 auto;
}

.work {
  margin-bottom: 40px;
}

h2 {
  margin-top: 50px;
  margin-bottom: 20px;
}

#gallery-cyrimoni {
  display: flex;
  flex-wrap: wrap;
  column-gap: 10px;
  row-gap: 15px;
}

#gallery-cyrimoni img {
  width: 200px;
  height: 200px;
  object-fit: cover;
  cursor: pointer;
}

#gallery-Mcyrimoni {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.comic-item {
  width: 200px;
  height: 200px;
  overflow: hidden;
  cursor: pointer;
}

.comic-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.85);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal-image {
  max-width: 80vw;
  max-height: 85vh;
  width: auto !important;
  height: auto !important;
  object-fit: contain;
  cursor: default;
}

.close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 45px;
  cursor: pointer;
  z-index: 1002;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 60px;
  cursor: pointer;
  user-select: none;
  padding: 20px;
  z-index: 1002;
}

.arrow:hover {
  opacity: 0.6;
}

.arrow-left {
  left: 10px;
}

.arrow-right {
  right: 10px;
}

.image-number {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 16px;
  z-index: 1002;
}

.comic-modal {
  display: none;
  position: fixed;
  z-index: 1100;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  overflow-y: auto;
}

.comic-modal.show {
  display: block;
}

.comic-close {
  position: fixed;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 45px;
  cursor: pointer;
  z-index: 1102;
}

.comic-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 60px;
  cursor: pointer;
  user-select: none;
  padding: 20px;
  z-index: 1102;
}

.comic-arrow:hover {
  opacity: 0.6;
}

.comic-arrow-left {
  left: 10px;
}

.comic-arrow-right {
  right: 10px;
}

.comic-pages {
  width: 80vw;
  max-width: 1000px;
  margin: 60px auto 40px;
}

.comic-pages img {
  display: block;
  width: auto;
  max-width: 80vw;
  max-height: 85vh;
  height: auto;
  margin: 0 auto 20px;
}

</style>

</head>

<body>

<div class="container">

<h1>既存/シリモニ</h1>

<div class="work">

<h2>イラスト</h2>

<div id="gallery-cyrimoni"></div>

<h2>漫画</h2>

<div id="gallery-Mcyrimoni"></div>

</div>

<div id="modal" class="modal">

<span class="close" onclick="closeModal()">
&times;
</span>

<span class="arrow arrow-left" onclick="previousImage()">
&#10094;
</span>

<img id="modalImage" class="modal-image" src="">

<span class="arrow arrow-right" onclick="nextImage()">
&#10095;
</span>

<div id="imageNumber" class="image-number"></div>

</div>

<div id="comicModal" class="comic-modal">

<span class="comic-close" onclick="closeComicModal()">
&times;
</span>

<span class="comic-arrow comic-arrow-left" onclick="previousComic()">
&#10094;
</span>

<span class="comic-arrow comic-arrow-right" onclick="nextComic()">
&#10095;
</span>

<div id="comicPages" class="comic-pages"></div>

</div>

<script>

const images = [];

for (let i = 1; i <= 63; i++) {
  images.push(
    `gallery-cyrimoni/${String(i).padStart(3, "0")}.PNG`
  );
}

images.reverse();

const comics = [
  {
    folder: "comic01",
    pages: 1
  },
  {
    folder: "comic02",
    pages: 2
  },
  {
    folder: "comic03",
    pages: 3
  },
  {
    folder: "comic04",
    pages: 1
  },
  {
    folder: "comic05",
    pages: 4
  },
  {
    folder: "comic06",
    pages: 1
  },
  {
    folder: "comic07",
    pages: 1
  },
  {
    folder: "comic08",
    pages: 2
  }
];

comics.reverse();

const galleryC =
  document.getElementById("gallery-cyrimoni");

for (let i = 0; i < images.length; i++) {

  const img = document.createElement("img");

  img.src = images[i];
  img.loading = "lazy";
  img.onclick = () => openModal(i);

  galleryC.appendChild(img);
}

const galleryM =
  document.getElementById("gallery-Mcyrimoni");

for (let i = 0; i < comics.length; i++) {

  const item = document.createElement("div");
  item.className = "comic-item";

  const img = document.createElement("img");

  img.src =
    `gallery-Mcyrimoni/${comics[i].folder}/001.PNG`;

  img.loading = "lazy";

  img.onclick = () => openComicModal(i);

  item.appendChild(img);
  galleryM.appendChild(item);
}

let currentIndex = 0;

function openModal(index) {

  currentIndex = index;

  updateImage();

  document
    .getElementById("modal")
    .classList
    .add("show");
}

function updateImage() {

  document
    .getElementById("modalImage")
    .src = images[currentIndex];

  document
    .getElementById("imageNumber")
    .textContent =
      (currentIndex + 1)
      + " / "
      + images.length;
}

function nextImage() {

  currentIndex++;

  if (currentIndex >= images.length) {
    currentIndex = 0;
  }

  updateImage();
}

function previousImage() {

  currentIndex--;

  if (currentIndex < 0) {
    currentIndex = images.length - 1;
  }

  updateImage();
}

function closeModal() {

  document
    .getElementById("modal")
    .classList
    .remove("show");
}

let currentComicIndex = 0;

function openComicModal(index) {

  currentComicIndex = index;

  showComic();

  document
    .getElementById("comicModal")
    .classList
    .add("show");
}

function showComic() {

  const comicPages =
    document.getElementById("comicPages");

  comicPages.innerHTML = "";

  const comic = comics[currentComicIndex];

  for (let i = 1; i <= comic.pages; i++) {

    const img =
      document.createElement("img");

    img.src =
      `gallery-Mcyrimoni/${comic.folder}/${String(i).padStart(3, "0")}.PNG`;

    img.loading = "lazy";

    comicPages.appendChild(img);
  }

  document
    .getElementById("comicModal")
    .scrollTop = 0;
}

function nextComic() {

  currentComicIndex++;

  if (currentComicIndex >= comics.length) {
    currentComicIndex = 0;
  }

  showComic();
}

function previousComic() {

  currentComicIndex--;

  if (currentComicIndex < 0) {
    currentComicIndex = comics.length - 1;
  }

  showComic();
}

function closeComicModal() {

  document
    .getElementById("comicModal")
    .classList
    .remove("show");
}

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {
      closeModal();
      closeComicModal();
    }

    if (
      document
        .getElementById("modal")
        .classList
        .contains("show")
    ) {

      if (event.key === "ArrowRight") {
        nextImage();
      }

      if (event.key === "ArrowLeft") {
        previousImage();
      }
    }

    if (
      document
        .getElementById("comicModal")
        .classList
        .contains("show")
    ) {

      if (event.key === "ArrowRight") {
        nextComic();
      }

      if (event.key === "ArrowLeft") {
        previousComic();
      }
    }
  }
);

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event) {

      if (event.target === this) {
        closeModal();
      }

    }
  );

document
  .getElementById("comicModal")
  .addEventListener(
    "click",
    function(event) {

      if (event.target === this) {
        closeComicModal();
      }

    }
  );

</script>

</body>

</html>
