<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水の小瓶</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #CFEFF6;
  color: #606487;
  font-family: "Hina Mincho", serif;
  overflow-x: hidden;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding-top: 40px;
}

.back {
  display: block;
  width: 90vw;
  max-width: 850px;
  margin: 0 auto;
  color: #606487;
  text-decoration: none;
  font-size: 16px;
}


/* ====================
   無限ループ
==================== */

.carousel-window {
  position: relative;
  width: 100%;
  overflow: hidden;
  margin-top: 55px;
  cursor: grab;
  touch-action: pan-y;
}


/* 左右をふわっと薄くする */

.carousel-window::before,
.carousel-window::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 180px;
  z-index: 5;
  pointer-events: none;
}

.carousel-window::before {
  left: 0;
  background: linear-gradient(
    to right,
    #CFEFF6 0%,
    rgba(207, 239, 246, 0) 100%
  );
}

.carousel-window::after {
  right: 0;
  background: linear-gradient(
    to left,
    #CFEFF6 0%,
    rgba(207, 239, 246, 0) 100%
  );
}


.carousel-window.dragging {
  cursor: grabbing;
}


.carousel-track {
  display: flex;
  width: max-content;
  align-items: flex-start;
  will-change: transform;
}


.item {
  flex: 0 0 170px;
  width: 170px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}


.bottle-wrap {
  width: 170px;
  height: 190px;
  display: flex;
  justify-content: center;
  align-items: center;
}


.bottle {
  width: 135px;
  height: 170px;
  object-fit: contain;
  pointer-events: none;
  will-change: transform;
}


/* ====================
   ぷかぷか
==================== */

.item:nth-child(1) .bottle {
  animation: float1 4.2s ease-in-out infinite;
}

.item:nth-child(2) .bottle {
  animation: float2 4.7s ease-in-out infinite;
}

.item:nth-child(3) .bottle {
  animation: float3 4.4s ease-in-out infinite;
}

.item:nth-child(4) .bottle {
  animation: float1 5s ease-in-out infinite;
}


@keyframes float1 {

  0%, 100% {
    transform: translate(0, 0) rotate(0deg);
  }

  50% {
    transform: translate(3px, -10px) rotate(0.6deg);
  }

}


@keyframes float2 {

  0%, 100% {
    transform: translate(0, -3px) rotate(0deg);
  }

  50% {
    transform: translate(-3px, 9px) rotate(-0.6deg);
  }

}


@keyframes float3 {

  0%, 100% {
    transform: translate(-2px, 2px) rotate(-0.3deg);
  }

  50% {
    transform: translate(2px, -8px) rotate(0.5deg);
  }

}


.title {
  margin-top: 4px;
  font-size: 12px;
  color: #606487;
  white-space: nowrap;
}


/* ====================
   モーダル
==================== */

.modal {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, .92);
  display: none;
  z-index: 10;
  overflow-y: auto;
  overflow-x: hidden;
}

.modal.open {
  display: block;
}


.close {
  position: fixed;
  top: 10px;
  right: 20px;
  color: white;
  font: 32px sans-serif;
  cursor: pointer;
  z-index: 30;
  user-select: none;
}


/* 1枚絵 */

.single-area {
  width: 100vw;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}


.single {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
}


/* 漫画 */

.comic-area {
  width: 100vw;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 70px 20px 40px;
}


.comic-page {
  display: block;
  max-width: 900px;
  width: auto;
  max-height: 90vh;
  object-fit: contain;
}


/* ====================
   スマホ
==================== */

@media (max-width: 600px) {

  .page {
    padding-top: 25px;
  }

  .back {
    width: 90vw;
  }

  .carousel-window {
    margin-top: 45px;
  }


  .carousel-window::before,
  .carousel-window::after {
    width: 70px;
  }


  .item {
    flex-basis: 125px;
    width: 125px;
  }


  .bottle-wrap {
    width: 125px;
    height: 155px;
  }


  .bottle {
    width: 30vw;
    height: 38vw;
    max-width: 115px;
    max-height: 145px;
  }


  .title {
    font-size: 11px;
  }


  .comic-area {
    padding: 60px 10px 30px;
    gap: 12px;
  }


  .comic-page {
    max-width: 100%;
    max-height: none;
  }

}

</style>
</head>


<body>

<div class="page">

  <a class="back" href="neri.html">
    ← 色を変える
  </a>


  <div
    class="carousel-window"
    id="carouselWindow"
  >

    <div
      class="carousel-track"
      id="track"
    ></div>

  </div>

</div>


<!-- ====================
     拡大表示
==================== -->

<div
  class="modal"
  id="modal"
>

  <div
    class="close"
    id="close"
  >
    ×
  </div>


  <!-- 1枚絵 -->

  <div
    class="single-area"
    id="singleArea"
  >

    <img
      class="single"
      id="single"
      src=""
      alt=""
    >

  </div>


  <!-- 漫画 -->

  <div
    class="comic-area"
    id="comicArea"
  >

    <img
      class="comic-page"
      id="comicPage1"
      src=""
      alt=""
    >

    <img
      class="comic-page"
      id="comicPage2"
      src=""
      alt=""
    >

  </div>

</div>


<script>


/* ====================
   作品
==================== */

const folder = "azure";

const bottle = "bin_azure.png";


const works = [

  {
    type: "image",

    src:
      `${folder}/001.PNG`,

    title:
      "たからもの"

  },

  {
    type: "comic",

    pages: [

      `${folder}/comic01/001.PNG`,
      `${folder}/comic01/002.PNG`

    ],

    title:
      "ほんのり視力が悪い故"

  }

];


const track =
  document.getElementById("track");


const windowEl =
  document.getElementById(
    "carouselWindow"
  );


const modal =
  document.getElementById("modal");


const singleArea =
  document.getElementById(
    "singleArea"
  );


const single =
  document.getElementById("single");


const comicArea =
  document.getElementById(
    "comicArea"
  );


const comicPage1 =
  document.getElementById(
    "comicPage1"
  );


const comicPage2 =
  document.getElementById(
    "comicPage2"
  );


const closeButton =
  document.getElementById("close");


/* ====================
   2作品を大量に複製
==================== */

const copies = 9;


for (
  let c = 0;
  c < copies;
  c++
) {

  works.forEach(
    (work, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      item.dataset.index =
        index;


      item.innerHTML = `

        <div class="bottle-wrap">

          <img
            class="bottle"
            src="${bottle}"
            alt=""
          >

        </div>

        <div class="title">
          ${work.title}
        </div>

      `;


      track.appendChild(item);

    }
  );

}


/* ====================
   無限スクロール
==================== */

let position = 0;

let velocity = -0.25;

let dragging = false;

let startX = 0;
let lastX = 0;

let moved = false;

let cycleWidth = 0;


/* 実際の2個分の幅 */

function updateCycleWidth() {

  const items =
    track.querySelectorAll(
      ".item"
    );


  if (
    items.length < 3
  ) {
    return;
  }


  const first =
    items[0].getBoundingClientRect();


  const third =
    items[2].getBoundingClientRect();


  cycleWidth =
    third.left - first.left;

}


/* 初期位置 */

function setInitialPosition() {

  updateCycleWidth();

  position =
    -cycleWidth * 4;

}


/* 無限ループ */

function normalizePosition() {

  if (!cycleWidth) {
    return;
  }


  while (
    position <=
    -cycleWidth * 5
  ) {

    position +=
      cycleWidth;

  }


  while (
    position >=
    -cycleWidth * 3
  ) {

    position -=
      cycleWidth;

  }

}


/* 表示 */

function render() {

  normalizePosition();


  track.style.transform =
    `translate3d(
      ${position}px,
      0,
      0
    )`;


  requestAnimationFrame(
    render
  );

}


/* 自動で左へ */

function autoMove() {

  if (!dragging) {

    position +=
      velocity;

  }


  requestAnimationFrame(
    autoMove
  );

}


/* ====================
   ドラッグ
==================== */

function pointerDown(x) {

  dragging = true;

  moved = false;

  startX = x;

  lastX = x;


  windowEl.classList.add(
    "dragging"
  );

}


function pointerMove(x) {

  if (!dragging) {
    return;
  }


  const dx =
    x - lastX;


  if (
    Math.abs(
      x - startX
    ) > 8
  ) {

    moved = true;

  }


  position += dx;

  lastX = x;

}


function pointerUp() {

  if (!dragging) {
    return;
  }


  dragging = false;


  windowEl.classList.remove(
    "dragging"
  );

}


windowEl.addEventListener(
  "pointerdown",
  e => {

    pointerDown(
      e.clientX
    );

  }
);


windowEl.addEventListener(
  "pointermove",
  e => {

    if (dragging) {

      pointerMove(
        e.clientX
      );

    }

  }
);


windowEl.addEventListener(
  "pointerup",
  pointerUp
);


windowEl.addEventListener(
  "pointercancel",
  pointerUp
);


windowEl.addEventListener(
  "pointerleave",
  pointerUp
);


/* ====================
   タップ
==================== */

track.addEventListener(
  "click",
  e => {

    if (moved) {

      moved = false;

      return;

    }


    const item =
      e.target.closest(
        ".item"
      );


    if (!item) {
      return;
    }


    const index =
      Number(
        item.dataset.index
      );


    const work =
      works[index];


    /* 1枚絵 */

    if (
      work.type === "image"
    ) {

      single.src =
        work.src;

      singleArea.style.display =
        "flex";

      comicArea.style.display =
        "none";

    }


    /* 漫画 */

    else if (
      work.type === "comic"
    ) {

      comicPage1.src =
        work.pages[0];

      comicPage2.src =
        work.pages[1];

      singleArea.style.display =
        "none";

      comicArea.style.display =
        "flex";

    }


    modal.classList.add(
      "open"
    );

  }
);


/* ====================
   モーダルを閉じる
==================== */

function closeModal() {

  modal.classList.remove(
    "open"
  );


  single.src = "";

  comicPage1.src = "";

  comicPage2.src = "";

}


closeButton.addEventListener(
  "click",
  e => {

    e.stopPropagation();

    closeModal();

  }
);


modal.addEventListener(
  "click",
  e => {

    if (
      e.target ===
      single ||
      e.target ===
      comicPage1 ||
      e.target ===
      comicPage2
    ) {

      return;

    }


    if (
      e.target ===
      closeButton
    ) {

      return;

    }


    closeModal();

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Escape"
    ) {

      closeModal();

    }

  }
);


/* ====================
   開始
==================== */

window.addEventListener(
  "load",
  () => {

    setInitialPosition();

    render();

    autoMove();

  }
);


/* 画面サイズ変更 */

window.addEventListener(
  "resize",
  () => {

    updateCycleWidth();

  }
);

</script>

</body>
</html>
