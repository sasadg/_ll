<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>既存/その他</title>

<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap" rel="stylesheet">

<style>

body {
  font-family: 'Hina Mincho', serif;
  background-color: #f5f5f5;
  margin: 40px;
}

.container {
  width: 80%;
  margin: 0 auto;
}

.work {
  margin-bottom: 50px;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
}

.work img {
  width: 200px;
  height: 200px;
  object-fit: cover;
  cursor: pointer;
  margin-right: 10px;
  margin-bottom: 15px;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100vw;
  height: 100vh;
  background-color: rgba(0, 0, 0, 0.9);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal-image {
  display: block;
  max-width: 85%;
  max-height: 85%;
  width: auto;
  height: auto;
  object-fit: contain;
}

.close {
  position: absolute;
  top: 15px;
  right: 30px;
  color: white;
  font-size: 50px;
  cursor: pointer;
  z-index: 1001;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 60px;
  cursor: pointer;
  user-select: none;
  z-index: 1001;
}

.arrow-left {
  left: 20px;
}

.arrow-right {
  right: 20px;
}

.image-number {
  position: absolute;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 20px;
  z-index: 1001;
}

</style>
</head>

<body>

<div class="container">

  <h1>既存/その他</h1>

  <div class="work">

    <div class="gallery" id="gallery-all"></div>

  </div>

</div>

<div class="modal" id="modal">

  <span class="close" onclick="closeModal()">&times;</span>

  <span class="arrow arrow-left" onclick="previousImage()">&#10094;</span>

  <img class="modal-image" id="modalImage">

  <span class="arrow arrow-right" onclick="nextImage()">&#10095;</span>

  <div class="image-number" id="imageNumber"></div>

</div>

<script>

const allImages = [];

function createGallery(galleryId, folder, count) {

  const gallery = document.getElementById(galleryId);

  for (let i = count; i >= 1; i--) {

    const number = String(i).padStart(3, '0');
    const src = folder + '/' + number + '.PNG';

    const img = document.createElement('img');

    img.src = src;

    const index = allImages.length;

    allImages.push(src);

    img.onclick = function() {
      openModal(index);
    };

    gallery.appendChild(img);
  }
}

createGallery('gallery-all', 'gallery-all', 43);

let currentIndex = 0;

function openModal(index) {

  currentIndex = index;

  const modal = document.getElementById('modal');

  modal.classList.add('show');

  updateImage();
}

function updateImage() {

  const modalImage = document.getElementById('modalImage');
  const imageNumber = document.getElementById('imageNumber');

  modalImage.src = allImages[currentIndex];

  imageNumber.textContent =
    (currentIndex + 1) + ' / ' + allImages.length;
}

function nextImage() {

  currentIndex++;

  if (currentIndex >= allImages.length) {
    currentIndex = 0;
  }

  updateImage();
}

function previousImage() {

  currentIndex--;

  if (currentIndex < 0) {
    currentIndex = allImages.length - 1;
  }

  updateImage();
}

function closeModal() {

  document.getElementById('modal').classList.remove('show');
}

document.addEventListener('keydown', function(event) {

  if (event.key === 'Escape') {
    closeModal();
  }

  if (event.key === 'ArrowRight') {
    nextImage();
  }

  if (event.key === 'ArrowLeft') {
    previousImage();
  }

});

document.getElementById('modal').addEventListener('click', function(event) {

  if (event.target === this) {
    closeModal();
  }

});

</script>

</body>
</html>
