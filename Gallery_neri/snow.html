<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白の小瓶</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #FFE5A1;
  color: #7C634F;
  font-family: "Hina Mincho", serif;
}

/* 戻る */
.back {
  position: fixed;
  top: 20px;
  left: 25px;
  z-index: 20;
  color: #7C634F;
  text-decoration: none;
  font-size: 18px;
}


/* ====================
   カルーセル
==================== */

.carousel-window {
  position: relative;
  width: 100%;
  overflow: hidden;
  padding-top: 75px;
  cursor: grab;
  touch-action: pan-y;
}


/* 左右をふわっと薄くする */

.carousel-window::before,
.carousel-window::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 180px;
  z-index: 5;
  pointer-events: none;
}

.carousel-window::before {
  left: 0;
  background: linear-gradient(
    to right,
    #E4E5EE 0%,
    rgba(228, 229, 238, 0) 100%
  );
}

.carousel-window::after {
  right: 0;
  background: linear-gradient(
    to left,
    #FFE5A1 0%,
    rgba(228, 229, 238, 0) 100%
  );
}


.carousel-window.dragging {
  cursor: grabbing;
}


.carousel-track {
  display: flex;
  width: max-content;
  align-items: flex-start;
  will-change: transform;
}


.item {
  flex: 0 0 170px;
  width: 170px;
  text-align: center;
  user-select: none;
}


/* 小瓶 */

.bottle-wrap {
  width: 170px;
  height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
}


.bottle {
  width: 135px;
  height: 170px;
  object-fit: contain;
  cursor: pointer;
}


/* ====================
   ぷかぷか
==================== */

.item:nth-child(1) .bottle {
  animation:
    float1 4.2s ease-in-out infinite;
}

.item:nth-child(2) .bottle {
  animation:
    float2 4.7s ease-in-out infinite;
}

.item:nth-child(3) .bottle {
  animation:
    float3 4.4s ease-in-out infinite;
}

.item:nth-child(4) .bottle {
  animation:
    float1 5s ease-in-out infinite;
}

.item:nth-child(5) .bottle {
  animation:
    float2 4.5s ease-in-out infinite;
}

.item:nth-child(6) .bottle {
  animation:
    float3 4.8s ease-in-out infinite;
}


@keyframes float1 {

  0%, 100% {
    transform:
      translate(0, 0)
      rotate(0deg);
  }

  50% {
    transform:
      translate(3px, -10px)
      rotate(0.6deg);
  }

}


@keyframes float2 {

  0%, 100% {
    transform:
      translate(0, -3px)
      rotate(0deg);
  }

  50% {
    transform:
      translate(-3px, 9px)
      rotate(-0.6deg);
  }

}


@keyframes float3 {

  0%, 100% {
    transform:
      translate(-2px, 2px)
      rotate(-0.3deg);
  }

  50% {
    transform:
      translate(2px, -8px)
      rotate(0.5deg);
  }

}


/* タイトル */

.title {
  margin-top: 8px;
  font-size: 16px;
  line-height: 1.7;
}


/* ====================
   購入確認モーダル
==================== */

#noticeModal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(40, 42, 60, 0.35);
  align-items: center;
  justify-content: center;
  padding: 20px;
}


.modal-box {
  width: min(420px, 90vw);
  background: #E4E5EE;
  padding: 28px 25px;
  text-align: center;
  color: #606487;
  box-shadow:
    0 8px 30px
    rgba(50, 50, 70, 0.15);
}


.modal-box p {
  margin: 0 0 18px;
  line-height: 1.8;
}


.modal-box .notice {
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 20px;
}


.modal-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
}


.modal-buttons button {
  border: 1px solid #606487;
  background: transparent;
  color: #606487;
  font-family: inherit;
  font-size: 15px;
  padding: 7px 22px;
  cursor: pointer;
}


.modal-buttons button:hover {
  background:
    rgba(96, 100, 135, 0.08);
}


/* ====================
   スマホ
==================== */

@media (max-width: 600px) {

  .back {
    top: 14px;
    left: 16px;
    font-size: 16px;
  }


  .carousel-window {
    padding-top: 65px;
  }


  /* スマホでは薄くなる範囲を短く */

  .carousel-window::before,
  .carousel-window::after {
    width: 70px;
  }


  .item {
    flex: 0 0 125px;
    width: 125px;
  }


  .bottle-wrap {
    width: 125px;
    height: 155px;
  }


  .bottle {
    width: 30vw;
    height: 38vw;
    max-width: 125px;
    max-height: 155px;
  }


  .title {
    font-size: 14px;
  }

}

</style>
</head>


<body>


<a
  href="neri.html"
  class="back"
>
  ← 戻る
</a>


<div
  class="carousel-window"
  id="carouselWindow"
>

  <div
    class="carousel-track"
    id="carouselTrack"
  ></div>

</div>


<!-- 購入確認 -->

<div id="noticeModal">

  <div class="modal-box">

    <p>
      BOOTHの商品ページへ移動します。
    </p>

    <div class="notice">
      この作品はBOOTHで販売しています。<br>
      You will be redirected to BOOTH.<br>
      将跳转至 BOOTH。<br>
      BOOTH 상품 페이지로 이동합니다.
    </div>

    <div class="modal-buttons">

      <button id="cancelBtn">
        戻る
      </button>

      <button id="confirmBtn">
        BOOTHへ
      </button>

    </div>

  </div>

</div>


<script>


const works = [

  {
    url:
      "https://sasadg.booth.pm/items/7975838",

    title:
      "宙ぶらりん<br>シリモニ"
  },

  {
    url:
      "ここにBOOTHのURL",

    title:
      "足元ぐるぐる人外ズ<br>シリモニ"
  },

  {
    url:
      "ここにBOOTHのURL",

    title:
      "足元ぐるぐる人外ズ<br>雪山組"
  }

];


const bottle =
  "bin_snow.png";


const track =
  document.getElementById(
    "carouselTrack"
  );


const windowEl =
  document.getElementById(
    "carouselWindow"
  );


const noticeModal =
  document.getElementById(
    "noticeModal"
  );


const cancelBtn =
  document.getElementById(
    "cancelBtn"
  );


const confirmBtn =
  document.getElementById(
    "confirmBtn"
  );


/* ====================
   3作品を大量に複製
==================== */

const repeatCount = 9;


for (
  let r = 0;
  r < repeatCount;
  r++
) {

  works.forEach(
    (work, index) => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "item";


      item.dataset.index =
        index;


      item.innerHTML = `

        <div class="bottle-wrap">

          <img
            src="${bottle}"
            class="bottle"
            draggable="false"
          >

        </div>

        <div class="title">
          ${work.title}
        </div>

      `;


      track.appendChild(item);

    }
  );

}


/* ====================
   無限スクロール
==================== */

let position = 0;


const velocity =
  -0.55;


let dragging = false;


let startX = 0;
let lastX = 0;


let moved = false;


let cycleWidth = 0;


/* 3個分の実際の幅 */

function updateCycleWidth() {

  const items =
    track.querySelectorAll(
      ".item"
    );


  if (
    items.length < 4
  ) {
    return;
  }


  const first =
    items[0]
      .getBoundingClientRect();


  const fourth =
    items[3]
      .getBoundingClientRect();


  cycleWidth =
    fourth.left - first.left;

}


/* 初期位置 */

function setInitialPosition() {

  updateCycleWidth();

  position =
    -cycleWidth * 4;

}


/* 無限ループ */

function normalizePosition() {

  if (!cycleWidth) {
    return;
  }


  while (
    position <=
    -cycleWidth * 5
  ) {

    position +=
      cycleWidth;

  }


  while (
    position >=
    -cycleWidth * 3
  ) {

    position -=
      cycleWidth;

  }

}


/* 表示 */

function render() {

  normalizePosition();


  track.style.transform =
    `translate3d(
      ${position}px,
      0,
      0
    )`;


  requestAnimationFrame(
    render
  );

}


/* 自動移動 */

function autoMove() {

  if (!dragging) {

    position +=
      velocity;

  }


  requestAnimationFrame(
    autoMove
  );

}


/* ====================
   ドラッグ
==================== */

function pointerDown(x) {

  dragging = true;

  moved = false;

  startX = x;
  lastX = x;

  windowEl.classList.add(
    "dragging"
  );

}


function pointerMove(x) {

  if (!dragging) {
    return;
  }


  const dx =
    x - lastX;


  if (
    Math.abs(
      x - startX
    ) > 8
  ) {

    moved = true;

  }


  position += dx;

  lastX = x;

}


function pointerUp() {

  if (!dragging) {
    return;
  }


  dragging = false;


  windowEl.classList.remove(
    "dragging"
  );

}


windowEl.addEventListener(
  "pointerdown",
  e => {

    pointerDown(
      e.clientX
    );

  }
);


windowEl.addEventListener(
  "pointermove",
  e => {

    if (dragging) {

      pointerMove(
        e.clientX
      );

    }

  }
);


windowEl.addEventListener(
  "pointerup",
  pointerUp
);


windowEl.addEventListener(
  "pointercancel",
  pointerUp
);


/* ====================
   クリック
==================== */

let destinationUrl =
  "";


track.addEventListener(
  "click",
  e => {

    if (moved) {

      moved = false;

      return;

    }


    const item =
      e.target.closest(
        ".item"
      );


    if (!item) {
      return;
    }


    const index =
      Number(
        item.dataset.index
      );


    destinationUrl =
      works[index].url;


    noticeModal.style.display =
      "flex";

  }
);


/* BOOTHへ */

confirmBtn.addEventListener(
  "click",
  () => {

    if (destinationUrl) {

      window.location.href =
        destinationUrl;

    }

  }
);


/* 戻る */

cancelBtn.addEventListener(
  "click",
  () => {

    destinationUrl =
      "";

    noticeModal.style.display =
      "none";

  }
);


/* モーダル外クリック */

noticeModal.addEventListener(
  "click",
  e => {

    if (
      e.target ===
      noticeModal
    ) {

      destinationUrl =
        "";

      noticeModal.style.display =
        "none";

    }

  }
);


/* ESC */

document.addEventListener(
  "keydown",
  e => {

    if (
      e.key === "Escape"
    ) {

      destinationUrl =
        "";

      noticeModal.style.display =
        "none";

    }

  }
);


/* ====================
   開始
==================== */

window.addEventListener(
  "load",
  () => {

    setInitialPosition();

    render();

    autoMove();

  }
);


/* 画面サイズ変更 */

window.addEventListener(
  "resize",
  () => {

    updateCycleWidth();

  }
);

</script>

</body>
</html>
