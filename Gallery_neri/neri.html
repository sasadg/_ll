<style>

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  padding: 0;

  width: 100%;

  min-height: 100%;

  font-family: "Hina Mincho", serif;

body {

a {

.page {

  --background-space: 40px;

  width: 100%;

  min-height: 100vh;

  padding: var(--background-space) 0;

  padding-bottom: var(--background-space);

  position: relative;

  background: #B8D9FF;

}

.page-background {

  position: absolute;

  top: var(--background-space);

  left: 0;

  display: block;

  width: 100%;

  height: auto;

  z-index: 0;

  pointer-events: none;

  user-select: none;

}

.page > :not(.page-background) {

  position: relative;

  z-index: 1;

}

/* 言語切り替え */

.language-switch {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 8px;

  padding: 10px 15px;

}

.language-switch button {

  border: 1px solid rgba(255,255,255,.8);

  border-radius: 20px;

  padding: 7px 13px;

  background: rgba(255,255,255,.25);

  color: white;

  font-family: inherit;

  font-size: 13px;

  cursor: pointer;

  transition: .2s;

}

.language-switch button.active {

  background: white;

  color: #729BCB;

}

/* 既存イラストへのリンク */

.back {

  display: block;

  width: 100%;

  max-width: none;

  margin: 0 0 12px;

  padding: 20px 40px;

  color: white;

  text-decoration: none;

  font-size: 16px;

  text-shadow: 0 1px 4px rgba(70, 100, 150, .2);

  width: 100%;

  padding: 0 0 10px;

  overflow: hidden;

}

  margin-top: 300px;

}

.water-section,

}

/* 英語タイトル */

  padding: 0 12px;

  text-align: center;

  font-family: "Sacramento", cursive;

  font-size: clamp(28px, 3.75vw, 45px);

  line-height: 1.15;

  font-weight: normal;

  letter-spacing: .015em;

  color: white;

  text-shadow: 0 1px 5px rgba(75, 110, 160, .15);

}

/* カルーセル */

.carousel-window {

  position: relative;

  width: 100%;

  overflow: hidden;

  margin-top: 0;

  cursor: grab;

  touch-action: pan-y;

  -webkit-mask-image: linear-gradient(

    to right,

    transparent 0,

    black 260px,

    black calc(100% - 260px),

    transparent 100%

  );

  mask-image: linear-gradient(

    to right,

    transparent 0,

    black 260px,

    black calc(100% - 260px),

    transparent 100%

  );

}

.carousel-window.dragging {

  cursor: grabbing;

}

.fade-image {

  position: absolute;

  top: 0;

  bottom: 0;

  width: 260px;

  z-index: 6;

  pointer-events: none;

  background-repeat: no-repeat;

  background-position: center;

  background-size: contain;

}

.fade-image-left {

  left: 0;

  background-image: url("fade-left.png");

}

.fade-image-right {

  right: 0;

  background-image: url("fade-right.png");

}

.carousel-track {

  display: flex;

  width: max-content;

  align-items: flex-start;

  will-change: transform;

}

.item {

  flex: 0 0 170px;

  width: 170px;

  text-align: center;

  cursor: pointer;

  user-select: none;

  -webkit-user-select: none;

  -webkit-tap-highlight-color: transparent;

}

.bottle-wrap {

  width: 170px;

  height: 150px;

  display: flex;

  justify-content: center;

  align-items: center;

}

.bottle {

  width: 135px;

  height: 140px;

  object-fit: contain;

  pointer-events: none;

  user-select: none;

  -webkit-user-drag: none;

  will-change: transform;

}

.item:nth-child(3n + 1) .bottle {

  animation: float1 4.2s ease-in-out infinite;

}

.item:nth-child(3n + 2) .bottle {

  animation: float2 4.7s ease-in-out infinite;

}

.item:nth-child(3n) .bottle {

  animation: float3 4.4s ease-in-out infinite;

}

@keyframes float1 {

  0%, 100% {

    transform: translate(0, 0) rotate(0deg);

  }

  50% {

    transform: translate(3px, -10px) rotate(.6deg);

  }

}

@keyframes float2 {

  0%, 100% {

    transform: translate(0, -3px) rotate(0deg);

  }

  50% {

    transform: translate(-3px, 9px) rotate(-.6deg);

}

@keyframes float3 {

/* =================================

   背景画像をページ全体に合わせる

================================= */

const page = document.getElementById("page");

const pageBackground =

  document.getElementById("pageBackground");

function fitPageToBackground() {

  if (

    !pageBackground.naturalWidth ||

    !pageBackground.naturalHeight

  ) {

    return;

  }

  const isMobile = window.innerWidth <= 600;

  const space = isMobile ? 20 : 40;

  page.style.minHeight = "0px";

  const pageHeight = Math.max(

    page.scrollHeight,

    window.innerHeight

  );

  pageBackground.style.top = space + "px";

  if (isMobile) {

    const targetHeight = Math.max(

      pageHeight - space * 2,

      1

    );

    const backgroundWidth =

      targetHeight *

      pageBackground.naturalWidth /

      pageBackground.naturalHeight;

    pageBackground.style.height =

      targetHeight + "px";

    pageBackground.style.width =

      backgroundWidth + "px";

    pageBackground.style.maxWidth = "none";

    pageBackground.style.left = "50%";

    pageBackground.style.transform =

      "translateX(-50%)";

    page.style.minHeight = pageHeight + "px";

  } else {

    pageBackground.style.width = "100%";

    pageBackground.style.height = "auto";

    pageBackground.style.maxWidth = "none";

    pageBackground.style.left = "0";

    pageBackground.style.transform = "none";

    const backgroundHeight =

      window.innerWidth *

      pageBackground.naturalHeight /

      pageBackground.naturalWidth;

    page.style.minHeight = Math.max(

      pageHeight,

      backgroundHeight + space * 2

    ) + "px";

  }

}

/* =================================

   作品タイトルの取得

================================= */

function getTitle(trackId, index) {

  let titleIndex = index;

  if (trackId === "waterTrack") {

    titleIndex += 8;

  }

  if (trackId === "whiteTrack") {

    titleIndex += 12;

  }

  return translations[currentLanguage][titleIndex];

}

/* =================================

   言語別画像の取得

================================= */

function getLocalizedImage(src, lang) {

  if (lang === "ja") {

    return src;

  }

  const parts = src.split("/");

  const filename = parts.pop();

  const folder = parts.join("/");

  return `${folder}/${lang}/${filename}`;

}

/* =================================

   作品画像の取得

================================= */

function getArtworkImage(work) {

  if (work.multilingual) {

    return getLocalizedImage(work.src, currentLanguage);

  }

  return work.src;

}

/* =================================

   漫画画像の取得

================================= */

function getComicPages(work) {

  if (currentLanguage === "ja") {

    return work.pages;

  }

  return work.pages.map(src =>

    getLocalizedImage(src, currentLanguage)

  );

}

/* =================================

   カルーセル

================================= */

function createCarousel(trackId, works) {

  const track = document.getElementById(trackId);

  const windowEl = track.parentElement;

  for (let c = 0; c < 9; c++) {

    works.forEach((work, index) => {

      const item = document.createElement("div");

      item.className = "item";

      item.dataset.index = index;

      const wrap = document.createElement("div");

      wrap.className = "bottle-wrap";

      const bottle = document.createElement("img");

      bottle.className = "bottle";

      bottle.src = work.bottle;

      bottle.alt = "";

      bottle.draggable = false;

      wrap.appendChild(bottle);

      const title = document.createElement("div");

      title.className = "title";

      title.innerHTML = getTitle(trackId, index);

      item.appendChild(wrap);

      item.appendChild(title);

      track.appendChild(item);

    });

  }

  let position = 0;

  const velocity = -0.25;

  let dragging = false;

  let startX = 0;

  let lastX = 0;

  let moved = false;

  let cycleWidth = 0;

  function updateCycleWidth() {

    const items = track.querySelectorAll(".item");

    if (items.length <= works.length) return;

    const first =

      items[0].getBoundingClientRect();

    const next =

      items[works.length].getBoundingClientRect();

    cycleWidth = next.left - first.left;

  }

  function setInitialPosition() {

    updateCycleWidth();

    if (cycleWidth) {

      position = -cycleWidth * 4;

    }

  }

  function normalizePosition() {

    if (!cycleWidth) return;

    while (position <= -cycleWidth * 5) {

      position += cycleWidth;

    }

    while (position >= -cycleWidth * 3) {

      position -= cycleWidth;

    }

  }

  function render() {

    normalizePosition();

    track.style.transform =

      `translate3d(${position}px, 0, 0)`;

    requestAnimationFrame(render);

  }

  function autoMove() {

    if (!dragging) {

      position += velocity;

    }

    requestAnimationFrame(autoMove);

  }

  function pointerDown(x) {

    dragging = true;

    moved = false;

    startX = x;

    lastX = x;

    windowEl.classList.add("dragging");

  }

  function pointerMove(x) {

    if (!dragging) return;

    const dx = x - lastX;

    if (Math.abs(x - startX) > 8) {

      moved = true;

    }

    position += dx;

    lastX = x;

  }

  function pointerUp() {

    if (!dragging) return;

    dragging = false;

    windowEl.classList.remove("dragging");

  }

  windowEl.addEventListener("pointerdown", e => {

    pointerDown(e.clientX);

  });

  windowEl.addEventListener("pointermove", e => {

    if (dragging) {

      pointerMove(e.clientX);

    }

  });

  windowEl.addEventListener("pointerup", pointerUp);

  windowEl.addEventListener("pointercancel", pointerUp);

  windowEl.addEventListener("pointerleave", pointerUp);

  track.addEventListener("click", e => {

    if (moved) {

      moved = false;

      return;

    }

    const item = e.target.closest(".item");

    if (!item) return;

    const work = works[Number(item.dataset.index)];

    openArtwork(

      work,

      works,

      Number(item.dataset.index),

      trackId

    );

  });

  return {

    start() {

      setInitialPosition();

      render();

      autoMove();

    },

    resize() {

      updateCycleWidth();

    }

  };

}

/* =================================

   イラスト・漫画の拡大表示

================================= */

const artModal =

  document.getElementById("artModal");

const artClose =

  document.getElementById("artClose");

const singleArea =

  document.getElementById("singleArea");

const single =

  document.getElementById("single");

const comicArea =

  document.getElementById("comicArea");

const comicPage1 =

  document.getElementById("comicPage1");

const comicPage2 =

  document.getElementById("comicPage2");

const artTitle =

  document.getElementById("artTitle");

const artPrev =

  document.getElementById("artPrev");

const artNext =

  document.getElementById("artNext");

let currentArtwork = null;

let currentWorks = [];

let currentWorkIndex = 0;

let currentTrackId = "";

function updateArtworkNavigation() {

  const hasNavigation = currentWorks.length > 1;

  artPrev.style.display = hasNavigation ? "block" : "none";

  artNext.style.display = hasNavigation ? "block" : "none";

  artPrev.disabled = false;

  artNext.disabled = false;

}

function openArtwork(work, works, index, trackId) {

  currentArtwork = work;

  if (works) currentWorks = works;

  if (Number.isInteger(index)) currentWorkIndex = index;

  if (trackId) currentTrackId = trackId;

  artTitle.innerHTML = getTitle(currentTrackId, currentWorkIndex);

  updateArtworkNavigation();

  if (work.type === "comic") {

    const pages = getComicPages(work);

    comicPage1.src = pages[0] || "";

    comicPage2.src = pages[1] || "";

    singleArea.style.display = "none";

    comicArea.style.display = "flex";

  } else {

    single.src = getArtworkImage(work);

    singleArea.style.display = "flex";

    comicArea.style.display = "none";

  }

  artModal.classList.add("open");

}

function closeArtwork() {

  artModal.classList.remove("open");

  single.src = "";

  comicPage1.src = "";

  comicPage2.src = "";

  currentArtwork = null;

  currentWorks = [];

  currentWorkIndex = 0;

  currentTrackId = "";

  artTitle.textContent = "";

}

function moveArtwork(direction) {

  if (currentWorks.length <= 1) return;

  let nextIndex =

    currentWorkIndex + direction;

  if (nextIndex < 0) {

    nextIndex = currentWorks.length - 1;

  }

  if (nextIndex >= currentWorks.length) {

    nextIndex = 0;

  }

  const nextWork = currentWorks[nextIndex];

  openArtwork(

    nextWork,

    currentWorks,

    nextIndex,

    currentTrackId

  );

}

artPrev.addEventListener("click", e => {

  e.stopPropagation();

  moveArtwork(-1);

});

artNext.addEventListener("click", e => {

  e.stopPropagation();

  moveArtwork(1);

});

artClose.addEventListener("click", e => {

  e.stopPropagation();

  closeArtwork();

});

artModal.addEventListener("click", e => {

  if (

    e.target === single ||

    e.target === comicPage1 ||

    e.target === comicPage2 ||

    e.target === artClose ||

    e.target === artPrev ||

    e.target === artNext

  ) {

    return;

  }

  closeArtwork();

});

/* =================================

   言語切り替え

================================= */

function changeLanguage(lang) {

  if (!translations[lang]) return;

  currentLanguage = lang;

  document.documentElement.lang = lang;

  document.getElementById("backLink").textContent =

    backTranslations[lang];

  languageButtons.forEach(button => {

    button.classList.toggle(

      "active",

      button.dataset.lang === lang

    );

  });

  document.querySelectorAll(".item").forEach(item => {

    const track = item.closest(".carousel-track");

    if (!track) return;

    const index = Number(item.dataset.index);

    const title = item.querySelector(".title");

    if (!title) return;

    title.innerHTML = getTitle(track.id, index);

  });

  if (currentArtwork && artModal.classList.contains("open")) {

    openArtwork(currentArtwork, currentWorks, currentWorkIndex, currentTrackId);

  }

  try {

    localStorage.setItem("comicLanguage", lang);

  } catch (e) {

    console.warn("言語設定を保存できませんでした。");

  }

  requestAnimationFrame(() => {

    fitPageToBackground();

  });

}

languageButtons.forEach(button => {

  button.addEventListener("click", () => {

    changeLanguage(button.dataset.lang);

  });

});

/* =================================

   ESCで閉じる・左右キーで移動

================================= */

document.addEventListener("keydown", e => {

  if (e.key === "Escape") {

    closeArtwork();

  }

  if (artModal.classList.contains("open")) {

    if (e.key === "ArrowLeft") {

      moveArtwork(-1);

    } else if (e.key === "ArrowRight") {

      moveArtwork(1);

    }

  }

});

/* =================================

   カルーセルの開始

================================= */

const orangeCarousel =

  createCarousel("orangeTrack", orangeWorks);

const waterCarousel =

  createCarousel("waterTrack", waterWorks);

const whiteCarousel =

  createCarousel("whiteTrack", whiteWorks);

function startCarousels() {

  orangeCarousel.start();

  waterCarousel.start();

  whiteCarousel.start();

  requestAnimationFrame(() => {

    fitPageToBackground();

  });

}

if (document.readyState === "complete") {

  startCarousels();

} else {

  window.addEventListener("load", startCarousels, {

    once: true

  });

}

/* =================================

   背景画像読み込み後の調整

================================= */

if (

  pageBackground.complete &&

  pageBackground.naturalWidth

) {

  requestAnimationFrame(fitPageToBackground);

} else {

  pageBackground.addEventListener("load", () => {

    requestAnimationFrame(fitPageToBackground);

  }, {

    once: true

  });

}

/* =================================

   初期言語の読み込み

================================= */

let savedLanguage = "ja";

try {

  savedLanguage =

    localStorage.getItem("comicLanguage") || "ja";

} catch (e) {

  savedLanguage = "ja";

}

if (!translations[savedLanguage]) {

  savedLanguage = "ja";

}

changeLanguage(savedLanguage);

/* =================================

   画面サイズ変更時

================================= */

window.addEventListener("resize", () => {

  fitPageToBackground();

  orangeCarousel.resize();

  waterCarousel.resize();

  whiteCarousel.resize();

});

</script>
