<title>Gallery/サイレント・ウィッチ</title>

<style>

body {
  background-color: #7C97CD;
  font-family: "Hina Mincho", serif;
  margin: 40px;
  color: #000;
}

.container {
  width: 80%;
  margin: 0 auto;
}

h1 {
  margin-bottom: 30px;
}

h2 {
  margin-top: 50px;
  margin-bottom: 20px;
}

.gallery-menu {
  position: fixed;
  top: 0;
  left: 0;
  width: 230px;
  height: 100vh;
  background-color: #E4E5EE;
  z-index: 2000;
  transform: translateX(-230px);
  transition: transform 0.3s ease;
  overflow-y: auto;
  padding: 25px 15px;
  box-sizing: border-box;
}

.gallery-menu.open {
  transform: translateX(0);
}

.menu-toggle {
  position: fixed;
  top: 50%;
  left: 0;
  transform: translateY(-50%);
  width: 28px;
  height: 100px;
  background-color: #E4E5EE;
  border: none;
  color: #000;
  font-family: "Hina Mincho", serif;
  cursor: pointer;
  z-index: 2001;
  writing-mode: vertical-rl;
  font-size: 14px;
  padding: 10px 5px;
  transition: left 0.3s ease;
}

.menu-toggle.open {
  left: 230px;
}

.menu-title {
  font-size: 18px;
  margin-bottom: 20px;
}

.menu-all {
  width: 100%;
  padding: 8px 5px;
  margin-bottom: 15px;
  border: none;
  background: transparent;
  color: #000;
  font-family: "Hina Mincho", serif;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}

.menu-all:hover {
  opacity: 0.55;
}

.menu-category {
  margin-bottom: 8px;
}

.menu-category-title {
  width: 100%;
  border: none;
  background: transparent;
  color: #000;
  font-family: "Hina Mincho", serif;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
  padding: 8px 5px;
}

.menu-category-title:hover {
  opacity: 0.55;
}

.menu-category-title::after {
  content: "＋";
  float: right;
}

.menu-category.open .menu-category-title::after {
  content: "－";
}

.menu-items {
  display: none;
  padding-left: 10px;
}

.menu-category.open .menu-items {
  display: block;
}

.menu-item {
  display: block;
  width: 100%;
  padding: 6px 5px;
  border: none;
  background: transparent;
  color: #000;
  font-family: "Hina Mincho", serif;
  font-size: 14px;
  text-align: left;
  cursor: pointer;
}

.menu-item:hover {
  opacity: 0.55;
}

.gallery {
  display: flex;
  flex-wrap: wrap;
  column-gap: 10px;
  row-gap: 15px;
}

.gallery img {
  width: 200px;
  height: 200px;
  object-fit: cover;
  cursor: pointer;
}

.comic-gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.comic-item {
  width: 200px;
  height: 200px;
  overflow: hidden;
  cursor: pointer;
}

.comic-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.85);
  justify-content: center;
  align-items: center;
}

.modal.show {
  display: flex;
}

.modal-image {
  max-width: 80vw;
  max-height: 85vh;
  width: auto !important;
  height: auto !important;
  object-fit: contain;
  cursor: default;
}

.close {
  position: absolute;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 45px;
  cursor: pointer;
  z-index: 1002;
}

.arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 60px;
  cursor: pointer;
  user-select: none;
  padding: 20px;
  z-index: 1002;
}

.arrow:hover {
  opacity: 0.6;
}

.arrow-left {
  left: 10px;
}

.arrow-right {
  right: 10px;
}

.image-number {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 16px;
  z-index: 1002;
}

.comic-modal {
  display: none;
  position: fixed;
  z-index: 1100;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.9);
  overflow-y: auto;
}

.comic-modal.show {
  display: block;
}

.comic-close {
  position: fixed;
  top: 15px;
  right: 25px;
  color: white;
  font-size: 45px;
  cursor: pointer;
  z-index: 1102;
}

.comic-arrow {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-size: 60px;
  cursor: pointer;
  user-select: none;
  padding: 20px;
  z-index: 1102;
}

.comic-arrow:hover {
  opacity: 0.6;
}

.comic-arrow-left {
  left: 10px;
}

.comic-arrow-right {
  right: 10px;
}

.comic-pages {
  width: 80vw;
  max-width: 1000px;
  margin: 60px auto 40px;
}

.comic-pages img {
  display: block;
  width: auto;
  max-width: 80vw;
  max-height: 85vh;
  height: auto;
  margin: 0 auto 20px;
}

@media (max-width: 600px) {

  body {
    margin: 20px 15px;
  }

  .container {
    width: 100%;
  }

  .gallery-menu {
    width: 200px;
    transform: translateX(-200px);
  }

  .menu-toggle.open {
    left: 200px;
  }

  .gallery img {
    width: calc(50vw - 25px);
    height: calc(50vw - 25px);
  }

  .comic-item {
    width: calc(50vw - 25px);
    height: calc(50vw - 25px);
  }

  .comic-pages {
    width: 95vw;
  }

  .comic-pages img {
    max-width: 95vw;
  }

}

</style>

images.reverse();
comics.reverse();

let displayedImages = [...images];

let displayedComics = [...comics];

function renderGallery() {

  const gallery =
    document.getElementById("gallery");

  gallery.innerHTML = "";

  for (let i = 0; i < displayedImages.length; i++) {

    const img =
      document.createElement("img");

    img.src =
      displayedImages[i].src;

    img.loading = "lazy";

    img.onclick =
      () => openModal(i);

    gallery.appendChild(img);

  }

}

function renderComics() {

  const gallery =
    document.getElementById("comicGallery");

  gallery.innerHTML = "";

  for (let i = 0; i < displayedComics.length; i++) {

    const item =
      document.createElement("div");

    item.className =
      "comic-item";

    const img =
      document.createElement("img");

    img.src =
      `Gallery/${displayedComics[i].folder}/001.PNG`;

    img.loading = "lazy";

    img.onclick =
      () => openComicModal(i);

    item.appendChild(img);

    gallery.appendChild(item);

  }

}

function showAll() {

  displayedImages =
    [...images];

  displayedComics =
    [...comics];

  document
    .getElementById("illustrationTitle")
    .style.display = "";

  document
    .getElementById("comicTitle")
    .style.display = "";

  renderGallery();

  renderComics();

}

function filterWorks(tag) {

  displayedImages =
    images.filter(
      work =>
        work.tags.includes(tag)
    );

  displayedComics =
    comics.filter(
      work =>
        work.tags.includes(tag)
    );

  document
    .getElementById("illustrationTitle")
    .style.display = "";

  document
    .getElementById("comicTitle")
    .style.display = "";

  renderGallery();

  renderComics();

}

function filterType(type) {

  if (type === "illustration") {

    displayedImages =
      [...images];

    displayedComics =
      [];

    document
      .getElementById("illustrationTitle")
      .style.display = "";

    document
      .getElementById("comicTitle")
      .style.display = "none";

  }

  if (type === "comic") {

    displayedImages =
      [];

    displayedComics =
      [...comics];

    document
      .getElementById("illustrationTitle")
      .style.display = "none";

    document
      .getElementById("comicTitle")
      .style.display = "";

  }

  renderGallery();

  renderComics();

}

let currentIndex = 0;

function openModal(index) {

  currentIndex =
    index;

  updateImage();

  document
    .getElementById("modal")
    .classList
    .add("show");

}

function updateImage() {

  document
    .getElementById("modalImage")
    .src =
      displayedImages[currentIndex].src;

  document
    .getElementById("imageNumber")
    .textContent =
      (currentIndex + 1)
      + " / "
      + displayedImages.length;

}

function nextImage() {

  if (displayedImages.length === 0) {
    return;
  }

  currentIndex++;

  if (
    currentIndex >=
    displayedImages.length
  ) {

    currentIndex = 0;

  }

  updateImage();

}

function previousImage() {

  if (displayedImages.length === 0) {
    return;
  }

  currentIndex--;

  if (currentIndex < 0) {

    currentIndex =
      displayedImages.length - 1;

  }

  updateImage();

}

function closeModal() {

  document
    .getElementById("modal")
    .classList
    .remove("show");

}

let currentComicIndex = 0;

function openComicModal(index) {

  currentComicIndex =
    index;

  showComic();

  document
    .getElementById("comicModal")
    .classList
    .add("show");

}

function showComic() {

  const comicPages =
    document.getElementById("comicPages");

  comicPages.innerHTML = "";

  const comic =
    displayedComics[currentComicIndex];

  for (
    let i = 1;
    i <= comic.pages;
    i++
  ) {

    const img =
      document.createElement("img");

    img.src =
      `Gallery/${comic.folder}/${String(i).padStart(3, "0")}.PNG`;

    img.loading = "lazy";

    comicPages.appendChild(img);

  }

  document
    .getElementById("comicModal")
    .scrollTop = 0;

}

function nextComic() {

  if (displayedComics.length === 0) {
    return;
  }

  currentComicIndex++;

  if (
    currentComicIndex >=
    displayedComics.length
  ) {

    currentComicIndex = 0;

  }

  showComic();

}

function previousComic() {

  if (displayedComics.length === 0) {
    return;
  }

  currentComicIndex--;

  if (currentComicIndex < 0) {

    currentComicIndex =
      displayedComics.length - 1;

  }

  showComic();

}

function closeComicModal() {

  document
    .getElementById("comicModal")
    .classList
    .remove("show");

}

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      closeModal();

      closeComicModal();

    }

    if (
      document
        .getElementById("modal")
        .classList
        .contains("show")
    ) {

      if (event.key === "ArrowRight") {
        nextImage();
      }

      if (event.key === "ArrowLeft") {
        previousImage();
      }

    }

    if (
      document
        .getElementById("comicModal")
        .classList
        .contains("show")
    ) {

      if (event.key === "ArrowRight") {
        nextComic();
      }

      if (event.key === "ArrowLeft") {
        previousComic();
      }

    }

  }
);

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event) {

      if (event.target === this) {
        closeModal();
      }

    }
  );

document
  .getElementById("comicModal")
  .addEventListener(
    "click",
    function(event) {

      if (event.target === this) {
        closeComicModal();
      }

    }
  );

showAll();

</script>
