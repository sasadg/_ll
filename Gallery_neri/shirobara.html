<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水の小瓶</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #CFEFF6;
  color: #606487;
  font-family: "Hina Mincho", serif;
  overflow-x: hidden;
}

.page {
  width: 100%;
  min-height: 100vh;
  padding-top: 40px;
}

.back {
  display: block;
  width: 90vw;
  max-width: 850px;
  margin: 0 auto;
  color: #606487;
  text-decoration: none;
  font-size: 16px;
}

.carousel-window {
  width: 100%;
  overflow: hidden;
  margin-top: 55px;
  cursor: grab;
  touch-action: pan-y;
}

.carousel-window.dragging {
  cursor: grabbing;
}

.carousel-track {
  display: flex;
  width: max-content;
  align-items: flex-start;
  will-change: transform;
}

.item {
  flex: 0 0 170px;
  width: 170px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.bottle-wrap {
  width: 170px;
  height: 190px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.bottle {
  width: 135px;
  height: 170px;
  object-fit: contain;
  pointer-events: none;
  will-change: transform;
}

.item:nth-child(1) .bottle {
  animation: float1 4.2s ease-in-out infinite;
}

.item:nth-child(2) .bottle {
  animation: float2 4.7s ease-in-out infinite;
}

.item:nth-child(3) .bottle {
  animation: float3 4.4s ease-in-out infinite;
}

.item:nth-child(4) .bottle {
  animation: float1 5s ease-in-out infinite;
}

@keyframes float1 {
  0%, 100% {
    transform: translate(0, 0) rotate(0deg);
  }
  50% {
    transform: translate(3px, -10px) rotate(0.6deg);
  }
}

@keyframes float2 {
  0%, 100% {
    transform: translate(0, -3px) rotate(0deg);
  }
  50% {
    transform: translate(-3px, 9px) rotate(-0.6deg);
  }
}

@keyframes float3 {
  0%, 100% {
    transform: translate(-2px, 2px) rotate(-0.3deg);
  }
  50% {
    transform: translate(2px, -8px) rotate(0.5deg);
  }
}

.title {
  margin-top: 4px;
  font-size: 12px;
  color: #606487;
  white-space: nowrap;
}


/* ====================
   モーダル
==================== */

.modal {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, .92);
  display: none;
  z-index: 10;
  overflow-y: auto;
  overflow-x: hidden;
}

.modal.open {
  display: block;
}

.close {
  position: fixed;
  top: 10px;
  right: 20px;
  color: white;
  font: 32px sans-serif;
  cursor: pointer;
  z-index: 30;
  user-select: none;
}

.single-area {
  width: 100vw;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.single {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
}

.comic-area {
  width: 100vw;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 50px 0 40px;
}

.comic {
  width: min(520px, 75vw);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.comic img {
  display: block;
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  height: auto;
  object-fit: contain;
}


@media (max-width: 600px) {

  .page {
    padding-top: 25px;
  }

  .back {
    width: 90vw;
  }

  .carousel-window {
    margin-top: 45px;
  }

  .item {
    flex-basis: 125px;
    width: 125px;
  }

  .bottle-wrap {
    width: 125px;
    height: 155px;
  }

  .bottle {
    width: 30vw;
    height: 38vw;
    max-width: 115px;
    max-height: 145px;
  }

  .title {
    font-size: 11px;
  }

  .comic-area {
    padding: 55px 0 30px;
  }

  .comic {
    width: 78vw;
    max-width: 500px;
    gap: 12px;
  }

  .comic img {
    width: 100%;
    max-width: 500px;
    max-height: 82vh;
  }
}
</style>
</head>

<body>

<div class="page">

  <a class="back" href="neri.html">← 色を変える</a>

  <div class="carousel-window" id="carouselWindow">
    <div class="carousel-track" id="track"></div>
  </div>

</div>


<div class="modal" id="modal">

  <div class="close" id="close">×</div>

  <div class="single-area" id="singleArea">

    <img
      class="single"
      id="single"
      src=""
      alt=""
    >

  </div>

  <div class="comic-area" id="comicArea">

    <div class="comic" id="comic"></div>

  </div>

</div>


<script>

const folder = "shirobara-kobin";
const bottle = "bin_shirobara.png";

const works = [

  {
    type: "image",
    src: `${folder}/001.PNG`,
    title: "たからもの"
  },

  {
    type: "comic",
    folder: `${folder}/comic01/`,
    title: "ほんのり視力が悪い故"
  }

];


const track = document.getElementById("track");
const windowEl = document.getElementById("carouselWindow");

const modal = document.getElementById("modal");
const closeButton = document.getElementById("close");

const singleArea = document.getElementById("singleArea");
const single = document.getElementById("single");

const comicArea = document.getElementById("comicArea");
const comic = document.getElementById("comic");


/* ====================
   画像を複製
==================== */

const copies = 9;

for (let c = 0; c < copies; c++) {

  works.forEach((work, index) => {

    const item = document.createElement("div");

    item.className = "item";

    item.dataset.index = index;

    item.innerHTML = `
      <div class="bottle-wrap">
        <img class="bottle" src="${bottle}" alt="">
      </div>
      <div class="title">${work.title}</div>
    `;

    track.appendChild(item);

  });

}


/* ====================
   無限スクロール
==================== */

let position = 0;
let velocity = -0.25;

let dragging = false;
let startX = 0;
let lastX = 0;
let moved = false;

const itemWidth = () =>
  window.innerWidth <= 600 ? 125 : 170;

const loopWidth = () =>
  itemWidth() * works.length;

position = -(loopWidth() * 4);


function normalizePosition() {

  const width = loopWidth();

  while (position < -(width * 5)) {
    position += width;
  }

  while (position > -(width * 3)) {
    position -= width;
  }

}


function render() {

  normalizePosition();

  track.style.transform =
    `translate3d(${position}px, 0, 0)`;

  requestAnimationFrame(render);

}


function autoMove() {

  if (!dragging) {
    position += velocity;
  }

  requestAnimationFrame(autoMove);

}


/* ====================
   ドラッグ
==================== */

function pointerDown(x) {

  dragging = true;
  moved = false;

  startX = x;
  lastX = x;

  windowEl.classList.add("dragging");

}


function pointerMove(x) {

  if (!dragging) return;

  const dx = x - lastX;

  if (Math.abs(x - startX) > 8) {
    moved = true;
  }

  position += dx;

  lastX = x;

}


function pointerUp() {

  if (!dragging) return;

  dragging = false;
  windowEl.classList.remove("dragging");

}


windowEl.addEventListener("pointerdown", e => {
  pointerDown(e.clientX);
});

windowEl.addEventListener("pointermove", e => {

  if (dragging) {
    pointerMove(e.clientX);
  }

});

windowEl.addEventListener("pointerup", pointerUp);
windowEl.addEventListener("pointercancel", pointerUp);
windowEl.addEventListener("pointerleave", pointerUp);


/* ====================
   タップ
==================== */

track.addEventListener("click", e => {

  if (moved) return;

  const item = e.target.closest(".item");

  if (!item) return;

  const index = Number(item.dataset.index);
  openWork(index);

});


function openWork(index) {

  const work = works[index];

  single.src = "";
  comic.innerHTML = "";

  singleArea.style.display = "none";
  comicArea.style.display = "none";


  if (work.type === "image") {

    singleArea.style.display = "flex";

    single.src = work.src;

  }


  if (work.type === "comic") {

    comicArea.style.display = "flex";

    const pages = [
      "001.PNG",
      "002.PNG"
    ];

    pages.forEach(file => {

      const img = document.createElement("img");

      img.src = `${work.folder}${file}`;
      img.alt = "";

      comic.appendChild(img);

    });

  }

  modal.classList.add("open");
  modal.scrollTop = 0;

}


function closeModal() {

  modal.classList.remove("open");

  single.src = "";
  comic.innerHTML = "";

}


closeButton.addEventListener("click", e => {

  e.stopPropagation();

  closeModal();

});


modal.addEventListener("click", e => {

  if (e.target === single) return;

  if (
    e.target.tagName === "IMG" &&
    comic.contains(e.target)
  ) {
    return;
  }

  if (e.target === closeButton) return;

  closeModal();

});


document.addEventListener("keydown", e => {

  if (e.key === "Escape") {
    closeModal();
  }

});


render();
autoMove();

</script>

</body>
</html>
