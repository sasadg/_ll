<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小瓶</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff;
  font-family: "Hina Mincho", serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  width: min(850px, 90vw);
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 70px;
}

/* 丸全体 */
.circle-link {
  text-decoration: none;
  color: #333;
  text-align: center;
  width: 180px;
}

/* ぷかぷかする部分 */
.circle {
  width: 180px;
  height: 180px;
  position: relative;
  animation: float 4s ease-in-out infinite;
}

/* 丸ごとに少しタイミングをずらす */
.circle-link:nth-child(2) .circle {
  animation-delay: -1.3s;
}

.circle-link:nth-child(3) .circle {
  animation-delay: -2.6s;
}

/* ふわっと浮く */
@keyframes float {
  0%, 100% {
    transform: translate(0, 0) rotate(0deg);
  }

  25% {
    transform: translate(3px, -7px) rotate(0.5deg);
  }

  50% {
    transform: translate(0, -12px) rotate(0deg);
  }

  75% {
    transform: translate(-3px, -6px) rotate(-0.5deg);
  }
}

.circle img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform 0.3s ease;
}

/* ホバー時 */
.circle-link:hover .circle img {
  transform: scale(1.05);
}

.circle-title {
  margin-top: 12px;
  font-size: 18px;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.circle-link:hover .circle-title {
  opacity: 1;
}

@media (max-width: 600px) {
  .container {
    width: 90vw;
    gap: 10px;
    justify-content: space-between;
  }

  .circle-link {
    width: 28vw;
    max-width: 130px;
  }

  .circle {
    width: 28vw;
    height: 28vw;
    max-width: 130px;
    max-height: 130px;
  }

  .circle-title {
    margin-top: 8px;
    font-size: 15px;
    opacity: 1;
    white-space: nowrap;
  }
}
</style>
</head>

<body>

<div class="container">

  <a class="circle-link" href="aki.html">
    <div class="circle">
      <img src="maru_aki.png" alt="秋の小瓶">
    </div>
    <div class="circle-title">秋の小瓶</div>
  </a>

  <a class="circle-link" href="shirobara.html">
    <div class="circle">
      <img src="maru_shirobara.png" alt="白薔薇の小瓶">
    </div>
    <div class="circle-title">白薔薇の小瓶</div>
  </a>

  <a class="circle-link" href="uzu.html">
    <div class="circle">
      <img src="maru_uzu.png" alt="渦の小瓶">
    </div>
    <div class="circle-title">渦の小瓶</div>
  </a>

</div>

</body>
</html>
